[project]
name = "spectracles"
dynamic = ["version"]
description = "Unified spectrospatial models: glasses for your spectra."
readme = "README.md"
authors = [
    { name = "Thomas Hilder", email = "Thomas.Hilder@monash.edu" },
    { name = "Andrew R. Casey", email = "Andrew.Casey@monash.edu" },
]
requires-python = ">=3.11"
dependencies = [
    "dill>=0.3.8",
    "equinox>=0.13.0",
    "jax>=0.5.3",
    "jax-finufft",
    "jaxtyping>=0.3.0",
    "matplotlib>=3.10.5",
    "networkx>=3.4",
    "optax>=0.2.0",
    "rich>=13.0",
    "tqdm>=4.67.1",
]

[project.optional-dependencies]
nifty = [
    "nifty[re]>=9.2",
]
pgm = [
    "daft-pgm>=0.1.4",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["src/spectracles/py.typed"]
exclude = ["**/__pycache__/**"]

[tool.hatch.build.targets.sdist]
include = ["src/**", "README.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/spectracles"]

[tool.hatch.build.hooks.vcs]
version-file = "src/spectracles/_version.py"

[tool.hatch.version]
source = "vcs"

[tool.ruff]
line-length = 99 # Sorry PEP8 I'm a rebel

[tool.ruff.lint.per-file-ignores]
# Experimental LVM model module; renaming it would break imports
"src/spectracles/lvm_models/OII_V1.py" = ["N999"]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.uv.sources]
jax-finufft = { git = "https://github.com/flatironinstitute/jax-finufft.git" }

[dependency-groups]
dev = [
    "astropy>=8.0.2",
    "blackjax>=1.7",
    "daft-pgm>=0.1.4",
    "mypy>=1.17.1",
    "nifty[re]>=9.2",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "ruff>=0.17.2",
    "types-networkx>=3.4.0.20240928",
    "types-tqdm>=4.67.0.20250809",
]
