site_name: spectracles
site_description: Spectrospatial modelling with JAX
repo_url: https://github.com/TomHilder/spectracles
repo_name: TomHilder/spectracles

theme:
  name: material
  palette:
    # Dark mode
    - scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    # Light mode
    - scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.expand
    - search.highlight

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - admonition
  - pymdownx.details
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Guides:
    - Priors and inference: inference.md
    - How it works: inference_design.md
    - Schedule Builder: schedule_builder.md
  - Examples:
    - examples/inference.md
    - examples/schedule_builder.md
  - API Reference:
    - api/share_module.md
    - api/models.md
    - api/priors.md
    - api/inference.md
    - api/nifty.md
    - api/pgm.md
    - api/opt_schedule.md
    - api/schedule_builder.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            show_root_heading: true
            heading_level: 2
            members_order: source
            docstring_style: google
